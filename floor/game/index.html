<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BLOOMFIRE (floor)</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<link rel="icon" href="data:,">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:#1a1c24; color:#f4ead6;
    font-family: Georgia, "Times New Roman", serif; touch-action:none; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #title { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(ellipse at 50% 40%, rgba(40,42,58,.75), rgba(14,14,22,.95)); text-align:center; padding:16px; }
  #title h1 { margin:0; font-size:clamp(34px,8vw,64px); letter-spacing:.18em; color:#ffd27a; text-shadow:0 0 18px rgba(255,160,60,.5); }
  #title p { margin:0; max-width:520px; font-size:14px; line-height:1.5; color:#d8d2c4; }
  #startb { margin-top:6px; padding:14px 40px; font:inherit; font-size:18px; letter-spacing:.2em; color:#1a1410; background:#ffd27a;
    border:0; border-radius:28px; cursor:pointer; box-shadow:0 0 22px rgba(255,190,90,.6); }
  #startb:disabled { opacity:.4 }
  #hud { position:fixed; inset:0; z-index:10; pointer-events:none; display:none; }
  #hud.on { display:block; }
  #cross { position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px; border:2px solid rgba(255,240,210,.85); border-radius:50%; }
  #cross.on { border-color:#ff3d8b; }
  #tl { position:absolute; left:12px; top:10px; font-size:14px; text-shadow:0 1px 3px #000; line-height:1.35; }
  #tr { position:absolute; right:12px; top:10px; text-align:right; font-size:14px; text-shadow:0 1px 3px #000; line-height:1.35; }
  #score { font-size:22px; color:#ffd27a; }
  #combo { font-size:18px; color:#ff8fbf; }
  #hpbar { width:150px; height:8px; background:rgba(0,0,0,.45); border-radius:4px; overflow:hidden; margin-top:3px; }
  #hpf { height:100%; width:100%; background:#e8705a; }
  #obj { position:absolute; left:50%; top:10px; transform:translateX(-50%); font-size:13px; text-shadow:0 1px 3px #000; white-space:nowrap; }
  #stick { position:fixed; left:22px; bottom:22px; width:130px; height:130px; border-radius:50%; z-index:12;
    background:rgba(255,255,255,.08); border:2px solid rgba(255,240,210,.35); display:none; touch-action:none; }
  #knob { position:absolute; left:40px; top:40px; width:50px; height:50px; border-radius:50%; background:rgba(255,230,180,.45); }
  .bt { position:fixed; z-index:12; width:74px; height:74px; border-radius:50%; display:none; align-items:center; justify-content:center;
    font-size:12px; letter-spacing:.1em; color:#1a1410; background:rgba(255,210,122,.75); border:0; touch-action:none; font-family:inherit; }
  #bloomb { right:24px; bottom:110px; background:rgba(255,120,180,.6); }
  #dashb { right:110px; bottom:28px; }
  #fireb { right:24px; bottom:24px; background:rgba(255,240,200,.75); }
  .floater { position:fixed; z-index:11; pointer-events:none; color:#ffd27a; font-size:18px; text-shadow:0 1px 3px #000; transition:transform .9s ease-out, opacity .9s; }
  #msg { position:absolute; left:50%; top:30%; transform:translateX(-50%); font-size:22px; color:#ffd27a; text-shadow:0 2px 6px #000; opacity:0; transition:opacity .4s; white-space:nowrap; }
  #hurt { position:fixed; inset:0; z-index:9; pointer-events:none; box-shadow:inset 0 0 90px rgba(200,20,60,.0); transition:box-shadow .25s; }
  #end { position:fixed; inset:0; z-index:31; display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    background:rgba(14,14,22,.85); text-align:center; }
  #end.on { display:flex; }
  #end button { padding:12px 34px; font:inherit; font-size:16px; border:0; border-radius:24px; background:#ffd27a; }
</style>
</head>
<body>
<div id="title">
  <h1>BLOOMFIRE</h1>
  <p>Ink has drowned the valley of Vell. Every kill paints the colour back. Cleanse the five inkwells.</p>
  <p style="font-size:12px;color:#9a96a8">Left stick move, drag right side to look, fire auto-locks. Desktop: WASD, mouse, click.</p>
  <button id="startb" disabled>LOADING</button>
</div>
<div id="hud">
  <div id="cross"></div>
  <div id="tl"><div id="score">0</div><div id="combo"></div><div id="hpbar"><div id="hpf"></div></div></div>
  <div id="tr"><div id="rest">0% restored</div><div id="wells">inkwells 0/5</div><div id="best"></div></div>
  <div id="obj"></div>
  <div id="msg"></div>
</div>
<div id="hurt"></div>
<div id="stick"><div id="knob"></div></div>
<button class="bt" id="fireb">FIRE</button>
<button class="bt" id="dashb">DASH</button>
<button class="bt" id="bloomb">BLOOM</button>
<div id="end"><h2 id="endt" style="margin:0;color:#ffd27a"></h2><p id="endp" style="margin:0"></p><button id="again">AGAIN</button></div>
<script type="module" src="main.js"></script>
</body>
</html>
